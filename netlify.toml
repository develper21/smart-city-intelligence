# ============================================================
#  CIVIC-AI Frontend — Netlify Configuration
# ============================================================
#  Deploy: Netlify Dashboard → Add new site → Import from Git → repo select.
#  Build settings isi file se auto-detect ho jayengi.
#
#  IMPORTANT: Deploy hone ke baad:
#    1. Netlify Site URL copy karein (jaise https://civic-ai-surveillance.netlify.app)
#    2. Render dashboard → civic-ai-api → Environment → CORS_ORIGINS me
#       wo URL add karein (trailing slash ke bina!)
#    3. Netlify → Site configuration → Environment variables me
#       VITE_API_URL set karein = Render backend ka URL
#       (ya neeche [build.environment] me bhi daal sakte hain)
# ============================================================

[build]
  # Vite production build
  command = "npm run build"
  # Vite ka output folder
  publish = "dist"

  # Deploy-time env: Render backend ka URL yahan daalein
  # (Site → Environment variables se override bhi kar sakte hain — wahi recommended hai)
  [build.environment]
    NODE_VERSION = "20"
    # VITE_API_URL = "https://civic-ai-api.onrender.com"

# ------------------------------------------------------------
# SPA fallback: /dashboard, /alerts jaise routes direct URL se
# khul sakein — sab index.html par redirect, 200 ke saath.
# ------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------
# Security headers
# ------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

# Cache: hashed assets ko permanently cache karo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
